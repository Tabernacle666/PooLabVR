; Phase 3 uses Geometry for the local sphere and Relief for the two outer zones.
; The Relief ellipse marks the limit between the surrounding and far zones.
[geometry]
enter_max_distance_m=6
exit_max_distance_m=7
enter_fov_fraction=0.20
exit_fov_fraction=0.23
ellipse_half_width_m=6
ellipse_exit_half_width_m=6.9

[relief]
enter_max_distance_m=25
exit_max_distance_m=27
enter_fov_fraction=0.40
exit_fov_fraction=0.43
ellipse_half_width_m=14
ellipse_exit_half_width_m=15

; The exterior view from inside a sphere uses this source refresh rate.
; The other Relief Lite limits are used by the phase 1 and 2 diagnostics.
[relief_lite]
enter_max_distance_m=48
exit_max_distance_m=51
enter_fov_fraction=0.60
exit_fov_fraction=0.63
ellipse_half_width_m=27
ellipse_exit_half_width_m=28.35
refresh_hz=12

[point]
enter_distance_m=250
exit_distance_m=220

[transition]
promote_ms=70
demote_ms=180
warp_duration_ms=120
warp_peak_deg=0.08
