name: OASIS VR compile
run-name: Compile VR candidates
on:
  push:
    branches: [main]
    paths: [.github/workflows/oasis-vr-restore.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compile candidates in order
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: 
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Base mismatch' }
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -cne 'c22c60f0c13069a4bb931590a1ea643b22fa54b5') { throw 'Source base changed' }
          $remote = @(git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or ($remote[0] -split "`t")[0] -cne $head) { throw 'Main changed' }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:CANDIDATES))
          $items = @($json | ConvertFrom-Json)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          foreach ($item in $items) {
            if ($item.path -cnotmatch '^[A-Za-z0-9_./ -]+$' -or $item.path.StartsWith('/') -or ($item.path -split '/' | Where-Object { $_ -in @('', '.', '..', '.git') })) { throw 'Invalid path' }
            $target = Join-Path $env:GITHUB_WORKSPACE $item.path
            if ($item.operation -ceq 'write') {
              if ($item.sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid blob SHA' }
              $blob = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$($item.sha)"
              if ($blob.sha -cne $item.sha -or $blob.encoding -cne 'base64') { throw 'Invalid blob response' }
              [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($blob.content))
              $actual = (git hash-object -- $item.path).Trim()
              if ($LASTEXITCODE -ne 0 -or $actual -cne $item.sha) { throw 'Blob mismatch' }
            } elseif ($item.operation -ceq 'delete') {
              if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'Invalid deletion' }
              Remove-Item -LiteralPath $target
            } else { throw 'Invalid operation' }
            git add -A -- $item.path
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage candidate' }
            $changed = @(git -c core.quotepath=false diff --cached --name-only)
            if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne $item.path) { throw 'Candidate must change exactly one file' }
            if ($item.operation -ceq 'write') {
              $staged = (git rev-parse ":$($item.path)").Trim()
              if ($LASTEXITCODE -ne 0 -or $staged -cne $item.sha) { throw 'Staged content differs from candidate' }
            }
            Write-Host "Compiling $($item.id) $($item.path)"
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/Build.ps1 -Target all -Parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -c user.name=OASIS -c user.email=oasis@localhost -c commit.gpgsign=false commit --quiet -m $item.id
            if ($LASTEXITCODE -ne 0) { throw 'Cannot record candidate' }
            Write-Host "$($item.id) compiled"
          }
