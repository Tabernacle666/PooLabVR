name: Urban core invariants
on:
  push:
    paths:
      - 'labs/labovr/UrbanLayout.*'
      - 'labs/labovr/UrbanSurface.*'
      - 'tests/urban/**'
      - 'labs/labovr/tools/UrbanMeshes.py'
      - 'labs/labovr/tools/UrbanFlyMeshes.py'
      - 'labs/labovr/assets/home_physics.gltf'
      - 'labs/labovr/assets/home_physics.bin'
      - 'labs/labovr/UrbanPhysics.cpp'
      - 'labs/labovr/HomePhysics.cpp'
      - 'labs/labovr/main.cpp'
      - 'tools/Build.ps1'
      - 'labs/labovr/HomeWorld.cpp'
      - 'labs/labovr/UrbanScene.cpp'
      - 'src/core/AtmosphereDomain.cpp'
      - 'src/core/SessionLog.cpp'
      - 'src/core/PopulationCuda.cu'
      - 'src/cartridge_api/LaboVRPhysicsService.h'
      - 'shaders/atmosphere.hlsl'
      - 'shaders/scene.hlsl'
      - 'src/core/Graphics.cpp'
      - 'src/core/FrameGraphDependencies.h'
      - 'src/core/Core.h'
      - '.github/workflows/urban-core.yml'
      - 'tools/DiagnosticCycle.ps1'
      - 'tools/DiagnosticAndCommit.ps1'
      - 'tools/CheckDiagnosticScripts.ps1'
  workflow_dispatch:
jobs:
  deterministic-layout-and-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable urban core tests
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 \
            tests/urban/UrbanCoreTests.cpp \
            labs/labovr/UrbanLayout.cpp labs/labovr/UrbanSurface.cpp \
            -o /tmp/poolab-urban-tests
      - name: Run invariants
        run: /tmp/poolab-urban-tests
      - name: Validate independent GPU pass ordering
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 tests/urban/FrameGraphOverlapTests.cpp -o /tmp/poolab-framegraph-tests
          /tmp/poolab-framegraph-tests
      - name: Validate PBR texture generator
        run: python3 tests/urban/TestUrbanTextures.py
      - name: Validate urban glTF generator
        run: python3 tests/urban/TestUrbanMeshes.py
      - name: Validate standalone insect mesh extraction
        run: python3 tests/urban/TestUrbanFlyMeshes.py
      - name: Validate packaged runtime dependencies
        run: python3 tests/urban/TestRuntimeStaging.py
      - name: Validate exterior visual source invariants
        run: python3 tests/urban/TestExteriorBaseline.py
  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse diagnostic scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\tools\CheckDiagnosticScripts.ps1
  windows-hlsl-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile fog shaders with the pinned DXC version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Direct3D.DXC/1.9.2607.13' -OutFile $zip
          $root = Join-Path $env:RUNNER_TEMP 'dxc'
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $dxc = Get-ChildItem -LiteralPath $root -Recurse -Filter dxc.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if(-not $dxc) { throw 'Pinned DXC x64 executable missing in NuGet package.' }
          $entries = @(
            @('atmosphere.hlsl','FogDensity','cs_6_6'),
            @('atmosphere.hlsl','FogIntegrate','cs_6_6'),
            @('atmosphere.hlsl','FogVS','vs_6_6'),
            @('atmosphere.hlsl','FogComposite','ps_6_6'),
            @('scene.hlsl','MeshMain','ms_6_6'),
            @('scene.hlsl','ShadowMain','ms_6_6'),
            @('scene.hlsl','PixelMain','ps_6_6'),
            @('scene.hlsl','DepthPixel','ps_6_6')
          )
          foreach($entry in $entries) {
            $out = Join-Path $env:RUNNER_TEMP ($entry[1]+'.cso')
            & $dxc.FullName -E $entry[1] -T $entry[2] -HV 2021 -D LAB_MSAA_SAMPLES=1 -O3 -Zpr -I shaders -Fo $out ("shaders/"+$entry[0])
            if($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw "Shader compile failed: $($entry[0]) / $($entry[1])" }
          }
  windows-native-cpp-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile urban client translation units with MSVC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'urban-syntax'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $sources = @(
            'labs/labovr/UrbanLayout.cpp',
            'labs/labovr/UrbanSurface.cpp',
            'labs/labovr/UrbanScene.cpp',
            'labs/labovr/UrbanPhysics.cpp',
            'labs/labovr/HomePhysics.cpp',
            'labs/labovr/HomeWorld.cpp'
          )
          foreach($source in $sources) {
            $obj = Join-Path $out (($source -replace '[/\\]', '_') + '.obj')
            & cl.exe /nologo /std:c++20 /Zc:__cplusplus /EHsc /c /DWIN32 /DNOMINMAX /DWIN32_LEAN_AND_MEAN /Ilabs/labovr /Isrc/core /Isrc/cartridge_api "/Fo$obj" $source
            if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $obj)) {
              throw "MSVC compile failed: $source"
            }
          }
